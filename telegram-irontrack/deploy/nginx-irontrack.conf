# Конфиг nginx для IronTrack. Проксирует внешние запросы (80/443) на Node.js-сервер,
# который слушает localhost:3000 (см. PORT в server/.env).
#
# Как использовать:
# 1. Замените YOUR_HOSTNAME на ваш реальный адрес — либо xxx-xxx-xxx-xxx.sslip.io
#    (подставьте IP через дефисы вместо точек), либо ваш собственный домен, если купите.
# 2. Положите этот файл на сервер: /etc/nginx/sites-available/irontrack
# 3. Создайте symlink: sudo ln -s /etc/nginx/sites-available/irontrack /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. Запустите certbot (см. DEPLOY_VPS.md) — он сам допишет сюда блоки для HTTPS.

server {
    listen 80;
    server_name YOUR_HOSTNAME;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
